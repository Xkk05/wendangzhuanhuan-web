name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy with local runner
    runs-on: ubuntu-22.04

    env:
      DEFAULT_DEPLOY_DIR: /www/wwwroot/converter-app
      COMPOSE_FILE: docker-compose.baota.yml
      DEPLOY_HEALTH_URL: http://43.154.197.96:3017/

    steps:
      - name: Fetch current revision
        run: |
          set -eu

          SRC_DIR="${RUNNER_TEMP:-/tmp}/converter-app-src"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
          REF_NAME="${{ github.ref_name }}"
          SHA="${{ github.sha }}"

          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
          cd "$SRC_DIR"

          git init
          git remote add origin "$REPO_URL"
          git fetch --depth=1 origin "$SHA" || git fetch --depth=1 origin "$REF_NAME"
          git checkout --force FETCH_HEAD
          git clean -fdx

          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Resolve deployment directory
        run: |
          set -eu

          DEPLOY_DIR="${DEPLOY_DIR:-}"
          if [ -z "$DEPLOY_DIR" ]; then
            for container in converter-frontend converter-backend; do
              candidate="$(docker inspect "$container" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' 2>/dev/null || true)"
              if [ -n "$candidate" ] && [ -f "$candidate/$COMPOSE_FILE" ]; then
                DEPLOY_DIR="$candidate"
                break
              fi
            done
          fi

          if [ -z "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="$DEFAULT_DEPLOY_DIR"
          fi

          mkdir -p "$DEPLOY_DIR"
          echo "Deploy directory: $DEPLOY_DIR"
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Sync release files
        run: |
          set -eu

          mkdir -p "$DEPLOY_DIR/docker-data/backend/uploads" \
                   "$DEPLOY_DIR/docker-data/backend/downloads" \
                   "$DEPLOY_DIR/docker-data/backend/logs"

          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete \
              --exclude='.git' \
              --exclude='docker-data' \
              --exclude='.env' \
              "$SRC_DIR"/ "$DEPLOY_DIR"/
          else
            tar -C "$SRC_DIR" \
              --exclude='./.git' \
              --exclude='./docker-data' \
              --exclude='./.env' \
              -cf - . | tar -C "$DEPLOY_DIR" -xf -
          fi

          chmod -R u+rwX,g+rwX "$DEPLOY_DIR/docker-data/backend" || true

      - name: Build and restart services
        run: |
          set -eu

          cd "$DEPLOY_DIR"

          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            echo "Docker Compose is not installed on this runner."
            exit 1
          fi

          $COMPOSE_CMD -f "$COMPOSE_FILE" config
          $COMPOSE_CMD -f "$COMPOSE_FILE" up -d --build --force-recreate backend frontend
          $COMPOSE_CMD -f "$COMPOSE_FILE" ps

      - name: Health check
        run: |
          set -eu

          echo "Checking $DEPLOY_HEALTH_URL"
          for i in $(seq 1 36); do
            if curl -fsS "$DEPLOY_HEALTH_URL" >/dev/null; then
              echo "Deployment is healthy."
              curl -fsS "$DEPLOY_HEALTH_URL" | grep -o "/assets/index-[^\"']*\.js" | head -n 1 || true
              exit 0
            fi

            echo "Waiting for service... ($i/36)"
            sleep 5
          done

          echo "Health check failed."
          exit 1
