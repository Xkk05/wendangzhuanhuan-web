name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Tencent CVM
    runs-on: ubuntu-22.04

    env:
      DEPLOY_HOST: 43.154.197.96
      DEPLOY_USER: root
      DEPLOY_PORT: 22
      DEPLOY_DIR: /www/wwwroot/converter-app
      COMPOSE_FILE: docker-compose.baota.yml
      DEPLOY_HEALTH_URL: http://43.154.197.96:3017/
      PUBLIC_SITE_URL: http://43.154.197.96:3017
      MEMBERSHIP_SUBSITE_NAME: http://43.154.197.96:3017/
      MEMBERSHIP_PAY_PAGE: https://kunqiongai.com/web_member_pay.html
      OAUTH_TOKEN_URL: https://login.kunqiongai.com/api/oauth/token
      PROD_OAUTH_REDIRECT_URI: http://43.154.197.96:3017/oauth/callback
      VITE_OAUTH_CALLBACK_URL: http://43.154.197.96:3017/oauth/callback
      PROD_OAUTH_CLIENT_ID: ${{ secrets.PROD_OAUTH_CLIENT_ID }}
      PROD_OAUTH_CLIENT_SECRET: ${{ secrets.PROD_OAUTH_CLIENT_SECRET }}
      DESKTOP_LOGIN_SECRET_KEY: ${{ secrets.DESKTOP_LOGIN_SECRET_KEY }}
      USER_CENTER_DB_PASSWORD: ${{ secrets.USER_CENTER_DB_PASSWORD }}

    steps:
      - name: Prepare SSH
        run: |
          set -eu
          test -n "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Checkout repository on runner
        run: |
          set -eu

          SRC_DIR="$RUNNER_TEMP/converter-app-src"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
          REF_NAME="${{ github.ref_name }}"
          SHA="${{ github.sha }}"

          rm -rf "$SRC_DIR"
          mkdir -p "$SRC_DIR"
          cd "$SRC_DIR"

          git init
          git remote add origin "$REPO_URL"
          git fetch --depth=1 origin "$SHA" || git fetch --depth=1 origin "$REF_NAME"
          git checkout --force FETCH_HEAD
          git clean -fdx

          cat > .env <<EOF
          PUBLIC_SITE_URL=${PUBLIC_SITE_URL}
          MEMBERSHIP_SUBSITE_NAME=${MEMBERSHIP_SUBSITE_NAME}
          PROD_OAUTH_CLIENT_ID=${PROD_OAUTH_CLIENT_ID}
          PROD_OAUTH_CLIENT_SECRET=${PROD_OAUTH_CLIENT_SECRET}
          MEMBERSHIP_PAY_PAGE=${MEMBERSHIP_PAY_PAGE}
          OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL}
          PROD_OAUTH_REDIRECT_URI=${PROD_OAUTH_REDIRECT_URI}
          VITE_OAUTH_CALLBACK_URL=${VITE_OAUTH_CALLBACK_URL}
          DESKTOP_LOGIN_SECRET_KEY=${DESKTOP_LOGIN_SECRET_KEY}
          USER_CENTER_DB_PASSWORD=${USER_CENTER_DB_PASSWORD}
          EOF

          tar --exclude='./.git' --exclude='./docker-data' -czf "$RUNNER_TEMP/converter-app.tar.gz" .

      - name: Upload release to server
        run: |
          set -eu

          scp -P "$DEPLOY_PORT" -i ~/.ssh/deploy_key "$RUNNER_TEMP/converter-app.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/converter-app.tar.gz"

      - name: Restart services on server
        run: |
          set -eu

          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' COMPOSE_FILE='$COMPOSE_FILE' bash -s" <<'REMOTE'
          set -eu

          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          find . -mindepth 1 -maxdepth 1 ! -name docker-data -exec rm -rf {} +
          tar -xzf /tmp/converter-app.tar.gz -C "$DEPLOY_DIR"
          rm -f /tmp/converter-app.tar.gz

          mkdir -p docker-data/backend/uploads docker-data/backend/downloads docker-data/backend/logs
          chmod -R u+rwX,g+rwX docker-data/backend

          if docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          else
            echo "Docker Compose is not installed on target server."
            exit 1
          fi

          echo "Target server listeners on port 3017:"
          ss -lntp 2>/dev/null | grep ':3017' || true
          echo "Target server containers publishing port 3017:"
          docker ps --filter publish=3017 --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Ports}}' || true

          $COMPOSE_CMD -f "$COMPOSE_FILE" config
          $COMPOSE_CMD -f "$COMPOSE_FILE" up -d --no-build --force-recreate backend frontend
          $COMPOSE_CMD -f "$COMPOSE_FILE" ps
          REMOTE

      - name: Health check
        run: |
          set -eu

          echo "Checking $DEPLOY_HEALTH_URL"
          for i in $(seq 1 30); do
            if curl -fsS "$DEPLOY_HEALTH_URL" >/dev/null; then
              echo "Deployment is healthy."
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 5
          done

          echo "Health check failed."
          exit 1
