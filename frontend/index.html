    <script>
      (function () {
        var suppressedPatterns = [
          'Download the React DevTools for a better development experience',
          'i18next is made possible by our own product, Locize',
          '[API]',
          '[OAuth]',
          '[Frontend] Converting',
          'Navigating to home page',
          'Navigating to /tools/',
          'Downloading from:',
          'Saving to file:',
          'Conversion cancelled',
          'No route found for source format:'
        ];

        function shouldSuppress(args) {
          return args.some(function (arg) {
            if (typeof arg !== 'string') return false;
            return suppressedPatterns.some(function (pattern) {
              return arg.indexOf(pattern) !== -1;
            });
          });
        }

        ['log', 'info', 'debug', 'warn'].forEach(function (method) {
          var original = console[method];
          if (typeof original !== 'function') return;
          console[method] = function () {
            var args = Array.prototype.slice.call(arguments);
            if (shouldSuppress(args)) {
              return;
            }
            return original.apply(console, args);
          };
        });
      })();
    </script>
