services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: converter-backend
    user: "10001:10001"
    environment:
      BACKEND_PORT: 8002
      BACKEND_UPLOAD_DIR: /data/uploads
      BACKEND_DOWNLOAD_DIR: /data/downloads
      BACKEND_LOG_DIR: /data/logs
      MEMBERSHIP_SUBSITE_NAME: ${MEMBERSHIP_SUBSITE_NAME:-https://doc.kunqiongai.com/}
      PROD_OAUTH_CLIENT_ID: ${PROD_OAUTH_CLIENT_ID}
      PROD_OAUTH_CLIENT_SECRET: ${PROD_OAUTH_CLIENT_SECRET}
      PROD_OAUTH_REDIRECT_URI: ${PROD_OAUTH_REDIRECT_URI:-http://43.154.197.96:3017/oauth/callback}
      MEMBERSHIP_PAY_PAGE: ${MEMBERSHIP_PAY_PAGE:-https://kunqiongai.com/web_member_pay.html}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-https://login.kunqiongai.com/api/oauth/token}
      DESKTOP_LOGIN_SECRET_KEY: ${DESKTOP_LOGIN_SECRET_KEY}
      USER_CENTER_DB_PASSWORD: ${USER_CENTER_DB_PASSWORD}
    volumes:
      - ./docker-data/backend:/data
    restart: unless-stopped
    # Bug#14: Resource limits to prevent DoS / OOM affecting host
    mem_limit: 4g
    cpus: '2'
    security_opt:
      - no-new-privileges:true
    read_only: false  # writable /data volume required for uploads/downloads
    networks:
      - converter-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_OAUTH_CALLBACK_URL: ${PROD_OAUTH_REDIRECT_URI:-http://43.154.197.96:3017/oauth/callback}
    container_name: converter-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3017:80"
    restart: unless-stopped
    networks:
      - converter-network

networks:
  converter-network:
    driver: bridge
